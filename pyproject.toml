[project]
name = "local-eye-camera"
version = "0.1.0"
description = "The software that will be running on the pi"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.163.1",
    "opencv-python>=5.0.0.93",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
local-eye = "project.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/project"]